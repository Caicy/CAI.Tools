<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://127.0.0.1:*"
    />
    <title>小薄荷 · 陪你聊聊</title>
  </head>
  <body>
    <main class="companion">
      <header class="titlebar">
        <span class="avatar" aria-hidden="true">🌱</span>
        <div>
          <h1>小薄荷 · 陪你聊聊</h1>
          <p>一点陪伴，一点好心情</p>
        </div>
        <button id="close" class="icon-button" title="收起" aria-label="收起陪聊窗口">×</button>
      </header>
      <section class="preferences" aria-label="陪聊设置">
        <label class="model-label" for="model">聊天模式</label>
        <select id="model" aria-label="聊天模型" disabled>
          <option value="">本地陪伴 · 不调用 AI</option>
        </select>
        <label class="review-label"
          ><input id="reviews" type="checkbox" disabled />快跑 AI 短评</label
        >
      </section>
      <nav class="interactions" aria-label="和小薄荷互动">
        <button id="pat" disabled>✋ 摸摸头</button><button id="feed" disabled>🍪 喂点心</button>
        <span>今天也辛苦啦</span>
      </nav>
      <section id="messages" class="messages" aria-label="对话记录" tabindex="0">
        <div class="empty-state">
          <span aria-hidden="true">☘</span>
          <p>我在这里，陪你歇一会儿。</p>
          <small>聊聊今天，或先摸摸我的头。</small>
        </div>
      </section>
      <p id="notice" class="notice" role="status" aria-live="polite">正在准备陪伴…</p>
      <form id="composer" class="composer">
        <label class="sr-only" for="draft">想对小薄荷说的话</label>
        <textarea
          id="draft"
          maxlength="1000"
          rows="2"
          placeholder="今天有什么想分享的？"
          disabled
        ></textarea>
        <div class="composer-actions">
          <button id="clear" type="button" class="quiet-button" disabled>清空</button>
          <span id="count" class="count">0 / 1000</span>
          <button id="cancel" type="button" class="quiet-button" hidden>停止</button>
          <button id="send" type="submit" class="send-button" disabled>发送 ↗</button>
        </div>
        <p class="hint">Enter 发送 · Shift + Enter 换行</p>
      </form>
    </main>
    <script type="module" src="/src/desktopPet/companion/main.ts"></script>
  </body>
</html>
