name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '试用版本号（须与此分支 package.json 一致）'
        required: true
        default: '3.2.0-local.12'
      publish_release:
        description: '发布 Windows 安装包和 ZIP 到 GitHub Release'
        type: boolean
        default: true
      prerelease:
        description: '标记为试用版 Pre-release'
        type: boolean
        default: true
      validate_upgrade:
        description: '只验收已发布版本的真实 Windows 安装升级，不重新构建'
        type: boolean
        default: false
      baseline_version:
        description: '安装升级验收的首次安装版本'
        required: false
        default: '3.2.0-local.4'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    if: github.repository == 'Caicy/CAI.Tools' && !inputs.validate_upgrade
    steps:
      - name: Check out source and API types
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify requested version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Reject mismatched tags rather than silently publishing a different package version.
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:REQUESTED_VERSION.TrimStart('v') -ne $version) {
            throw "Requested version must match package.json ($version)."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+-local\.\d+$' -or $env:IS_PRERELEASE -ne 'true') {
            throw 'local update channel requires a local.x version and prerelease=true.'
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Reject reused release tags
        if: inputs.publish_release
        uses: actions/github-script@v7
        with:
          script: |
            // Never replace an installed version's metadata or artifacts in place.
            const version = JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/v${version}` })
            } catch (error) {
              if (error.status === 404) return
              throw error
            }
            throw new Error(`Tag v${version} already exists; increment the local version.`)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            internal-plugins/setting/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Electron and canonical Windows test paths
        shell: pwsh
        run: |
          # Some hosted images expose TEMP through an 8.3 alias. Tests must use
          # a physical path rather than relaxing the application's path boundary.
          $physicalTemp = node -e "process.stdout.write(require('fs').realpathSync.native(process.env.RUNNER_TEMP))"
          $testTemp = Join-Path $physicalTemp 'cai-tools-tests'
          New-Item -ItemType Directory -Path $testTemp -Force | Out-Null
          "TEMP=$testTemp" >> $env:GITHUB_ENV
          "TMP=$testTemp" >> $env:GITHUB_ENV
          # Ensure Node-based unit imports can locate Electron even if pnpm
          # skipped its install hook; this uses the pinned dependency installer.
          node node_modules/electron/install.js
          if ($LASTEXITCODE -ne 0) { throw 'Electron runtime preparation failed.' }

      - name: Run unit and release-contract tests
        run: pnpm test

      - name: Build Windows source
        env:
          ZTOOLS_TARGET_PLATFORM: win32
        run: pnpm build

      - name: Verify context menu plugin with source Electron
        run: pnpm test:e2e tests/e2e/windows-context-menu.spec.ts

      - name: Upload context menu verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: context-menu-verification
          path: test-results/playwright
          if-no-files-found: ignore

      - name: Package Windows installer and ZIP
        shell: pwsh
        run: |
          # pnpm 11 emits separate JSON trees for our separate-lockfile workspace;
          # electron-builder 26 expects one application tree. Source compilation
          # has finished, so temporarily hide only the workspace manifest.
          $manifestBackup = Join-Path $env:RUNNER_TEMP 'cai-tools-pnpm-workspace.yaml'
          Move-Item -LiteralPath pnpm-workspace.yaml -Destination $manifestBackup
          try {
            # Invoke the installed binary directly; pnpm exec would reinstall the
            # workspace after noticing the temporarily relocated manifest.
            & .\node_modules\.bin\electron-builder.cmd --win --publish never
            if ($LASTEXITCODE -ne 0) {
              throw 'Windows packaging failed.'
            }
          } finally {
            # Restore the checkout even when packaging fails.
            Copy-Item -LiteralPath $manifestBackup -Destination pnpm-workspace.yaml -Force
            Remove-Item -LiteralPath $manifestBackup
          }

      - name: Verify updater metadata and packaged identity
        run: node scripts/verify-windows-update.mjs dist

      - name: Verify bundled context menu plugin
        shell: pwsh
        run: |
          # Check the actual packaged resources before allowing publication.
          $plugin = Join-Path 'dist/win-unpacked/resources/app.asar.unpacked/internal-plugins' 'windows-context-menu'
          $manifest = Get-Content -LiteralPath (Join-Path $plugin 'plugin.json') -Raw | ConvertFrom-Json
          if ($manifest.name -ne 'windows-context-menu' -or !(Test-Path -LiteralPath (Join-Path $plugin 'index.html'))) {
            throw 'The Windows context menu plugin is missing from the application package.'
          }
          if (@(Get-ChildItem -LiteralPath (Join-Path $plugin 'assets') -Filter '*.js' -File).Count -eq 0) {
            throw 'The packaged context menu plugin has no compiled JavaScript.'
          }

      - name: Verify packages and create checksums
        id: metadata
        shell: pwsh
        run: |
          # Require both supported distribution formats before uploading or publishing.
          $installers = @(Get-ChildItem -LiteralPath dist -Filter '*-setup.exe' -File)
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File)
          if ($installers.Count -ne 1 -or $archives.Count -ne 1) {
            throw 'Expected exactly one Windows installer and one ZIP package.'
          }
          $packages = @($installers) + @($archives)
          $packages += @(Get-ChildItem -LiteralPath dist -Filter 'local.yml' -File)
          $packages += @(Get-ChildItem -LiteralPath dist -Filter '*-setup.exe.blockmap' -File)
          $checksums = foreach ($package in $packages) {
            $digest = Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256
            '{0}  {1}' -f $digest.Hash.ToLowerInvariant(), $package.Name
          }
          $checksums | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8

          # Derive the release tag from the version actually built in this checkout.
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "Windows x64 build: v$version ($env:GITHUB_SHA)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CAI.Tools-windows-x64
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/local.yml
            dist/*-setup.exe.blockmap
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        id: release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          name: CAI.Tools ${{ steps.metadata.outputs.tag }}
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          draft: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            CAI.Tools Windows x64 本地版预发布构建。

            首次安装请使用 *-setup.exe。启用自有自动更新的安装版可在软件内检查、下载和安装后续 local.x 版本。
            ZIP 为便携分发，不支持软件内替换；请先使用完整安装程序安装。
            更新保留本地设置、插件和数据库。更新元数据 local.yml、差分 blockmap 与 SHA256SUMS.txt 随本版本发布。
            旧 local.1～local.3 首次切换仍需手动安装启用更新的完整版本。

            本流水线校验更新制品的版本、来源和摘要；实际安装升级验证结果请查阅对应版本的验收记录。
          files: |
            dist/*-setup.exe
            dist/*.zip
            dist/local.yml
            dist/*-setup.exe.blockmap
            dist/SHA256SUMS.txt

      - name: Expose completed release to update clients
        if: inputs.publish_release
        uses: actions/github-script@v7
        with:
          script: |
            // Keep the Atom feed unchanged until every required artifact has uploaded.
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number('${{ steps.release.outputs.id }}'),
              draft: false,
              prerelease: true,
              make_latest: 'false'
            })

  windows-upgrade:
    name: Published Windows installer upgrade
    if: github.repository == 'Caicy/CAI.Tools' && inputs.validate_upgrade
    runs-on: windows-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out acceptance harness
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install acceptance dependencies
        run: pnpm install --frozen-lockfile
      - name: Prepare canonical acceptance temp path
        shell: pwsh
        run: |
          $physicalTemp = node -e "process.stdout.write(require('fs').realpathSync.native(process.env.RUNNER_TEMP))"
          "RUNNER_TEMP=$physicalTemp" >> $env:GITHUB_ENV
          "TEMP=$physicalTemp" >> $env:GITHUB_ENV
          "TMP=$physicalTemp" >> $env:GITHUB_ENV
      - name: Install baseline and update through the application
        shell: pwsh
        env:
          BASELINE_VERSION: ${{ inputs.baseline_version }}
          TARGET_VERSION: ${{ inputs.version }}
        run: node scripts/verify-windows-upgrade.cjs $env:BASELINE_VERSION $env:TARGET_VERSION
      - name: Upload installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CAI.Tools-windows-upgrade-evidence
          if-no-files-found: warn
          path: test-results/windows-upgrade/
