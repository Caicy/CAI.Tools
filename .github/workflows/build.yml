name: Windows Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: '试用版本号（须与此分支 package.json 一致）'
        required: true
        default: '3.2.0-local.4'
      publish_release:
        description: '发布 Windows 安装包和 ZIP 到 GitHub Release'
        type: boolean
        default: true
      prerelease:
        description: '标记为试用版 Pre-release'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    if: github.repository == 'Caicy/CAI.Tools'
    steps:
      - name: Check out source and API types
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify requested version
        shell: pwsh
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          # Reject mismatched tags rather than silently publishing a different package version.
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:REQUESTED_VERSION.TrimStart('v') -ne $version) {
            throw "Requested version must match package.json ($version)."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+-local\.\d+$' -or $env:IS_PRERELEASE -ne 'true') {
            throw 'local update channel requires a local.x version and prerelease=true.'
          }

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.18.0

      - name: Reject reused release tags
        if: inputs.publish_release
        uses: actions/github-script@v7
        with:
          script: |
            // Never replace an installed version's metadata or artifacts in place.
            const version = JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version
            try {
              await github.rest.git.getRef({ ...context.repo, ref: `tags/v${version}` })
            } catch (error) {
              if (error.status === 404) return
              throw error
            }
            throw new Error(`Tag v${version} already exists; increment the local version.`)

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            internal-plugins/setting/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit and release-contract tests
        run: pnpm test

      - name: Build Windows source
        env:
          ZTOOLS_TARGET_PLATFORM: win32
        run: pnpm build

      - name: Package Windows installer and ZIP
        shell: pwsh
        run: |
          # pnpm 11 emits separate JSON trees for our separate-lockfile workspace;
          # electron-builder 26 expects one application tree. Source compilation
          # has finished, so temporarily hide only the workspace manifest.
          $manifestBackup = Join-Path $env:RUNNER_TEMP 'cai-tools-pnpm-workspace.yaml'
          Move-Item -LiteralPath pnpm-workspace.yaml -Destination $manifestBackup
          try {
            # Invoke the installed binary directly; pnpm exec would reinstall the
            # workspace after noticing the temporarily relocated manifest.
            & .\node_modules\.bin\electron-builder.cmd --win --publish never
            if ($LASTEXITCODE -ne 0) {
              throw 'Windows packaging failed.'
            }
          } finally {
            # Restore the checkout even when packaging fails.
            Copy-Item -LiteralPath $manifestBackup -Destination pnpm-workspace.yaml -Force
            Remove-Item -LiteralPath $manifestBackup
          }

      - name: Verify updater metadata and packaged identity
        run: node scripts/verify-windows-update.mjs dist

      - name: Verify packages and create checksums
        id: metadata
        shell: pwsh
        run: |
          # Require both supported distribution formats before uploading or publishing.
          $installers = @(Get-ChildItem -LiteralPath dist -Filter '*-setup.exe' -File)
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*.zip' -File)
          if ($installers.Count -ne 1 -or $archives.Count -ne 1) {
            throw 'Expected exactly one Windows installer and one ZIP package.'
          }
          $packages = @($installers) + @($archives)
          $packages += @(Get-ChildItem -LiteralPath dist -Filter 'local.yml' -File)
          $packages += @(Get-ChildItem -LiteralPath dist -Filter '*-setup.exe.blockmap' -File)
          $checksums = foreach ($package in $packages) {
            $digest = Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256
            '{0}  {1}' -f $digest.Hash.ToLowerInvariant(), $package.Name
          }
          $checksums | Set-Content -LiteralPath dist/SHA256SUMS.txt -Encoding utf8

          # Derive the release tag from the version actually built in this checkout.
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "Windows x64 build: v$version ($env:GITHUB_SHA)" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: CAI.Tools-windows-x64
          if-no-files-found: error
          path: |
            dist/*-setup.exe
            dist/*.zip
            dist/local.yml
            dist/*-setup.exe.blockmap
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        id: release
        if: inputs.publish_release
        uses: softprops/action-gh-release@v2
        with:
          name: CAI.Tools ${{ steps.metadata.outputs.tag }}
          tag_name: ${{ steps.metadata.outputs.tag }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ inputs.prerelease }}
          draft: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            CAI.Tools Windows x64 本地版预发布构建。

            首次安装请使用 *-setup.exe。启用自有自动更新的安装版可在软件内检查、下载和安装后续 local.x 版本。
            ZIP 为便携分发，不支持软件内替换；请先使用完整安装程序安装。
            更新保留本地设置、插件和数据库。更新元数据 local.yml、差分 blockmap 与 SHA256SUMS.txt 随本版本发布。
            旧 local.1～local.3 首次切换仍需手动安装启用更新的完整版本。

            本流水线校验更新制品的版本、来源和摘要；实际安装升级验证结果请查阅对应版本的验收记录。
          files: |
            dist/*-setup.exe
            dist/*.zip
            dist/local.yml
            dist/*-setup.exe.blockmap
            dist/SHA256SUMS.txt

      - name: Expose completed release to update clients
        if: inputs.publish_release
        uses: actions/github-script@v7
        with:
          script: |
            // Keep the Atom feed unchanged until every required artifact has uploaded.
            await github.rest.repos.updateRelease({
              ...context.repo,
              release_id: Number('${{ steps.release.outputs.id }}'),
              draft: false,
              prerelease: true,
              make_latest: 'false'
            })
